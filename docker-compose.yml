services:
  tennis-app:
    build: .
    container_name: tennis
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
    volumes:
      # Bind mount: ./db/data è una cartella reale del progetto, visibile e
      # backuppabile dal Finder (anche con Time Machine). Contiene SOLO il
      # database SQLite, non il codice: database.js e schema.sql restano
      # nell'immagine e si aggiornano sempre ad ogni rebuild.
      - ./db/data:/app/db/data
    restart: unless-stopped
