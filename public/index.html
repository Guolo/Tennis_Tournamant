<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tornei Tennis</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="header">
  <h1>🎾 Tennis</h1>
  <p>Organizza e gestisci tornei o match in doppio</p>
</div>

<div class="contenitore">

  <!-- Selettore modalità: Torneo (girone) o Doppio (match singolo) -->
  <div class="card card-toggle">
    <div class="toggle-modalita" id="toggle-modalita" role="tablist">
      <span class="toggle-indicatore" id="toggle-indicatore" aria-hidden="true"></span>
      <button type="button" class="toggle-opzione attivo" data-tipo="torneo" role="tab" aria-selected="true">Torneo</button>
      <button type="button" class="toggle-opzione" data-tipo="doppio" role="tab" aria-selected="false">Doppio</button>
    </div>
  </div>

  <!-- Avvia nuovo torneo / nuovo match di doppio -->
  <div class="card">
    <a href="/create.html?tipo=torneo" class="btn btn-primario" id="link-nuovo">+ Nuovo Torneo</a>
  </div>

  <!-- Recupero torneo tramite seed -->
  <div class="card">
    <p class="card-titolo">Riprendi un torneo</p>
    <label for="input-seed">Seed / Codice di recupero</label>
    <div class="gruppo-seed">
      <input type="text" id="input-seed" placeholder="ES. X7K9P2QZ" maxlength="12" />
      <button class="btn-neutro" id="btn-entra">Entra</button>
    </div>
    <div id="errore-seed"></div>
  </div>

  <!-- Storico tornei conclusi -->
  <div class="card">
    <p class="card-titolo" id="titolo-storico">Storico Tornei</p>
    <div id="lista-storico">
      <div class="spinner">Caricamento…</div>
    </div>
  </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
